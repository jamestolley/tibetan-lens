<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tibetan Page Tools Demo</title>
    <style>
      body {
        max-width: 860px;
        margin: 0 auto;
        padding: 48px 20px 72px;
        background: #f6f0e3;
        color: #241d16;
        font: 20px/1.7 Georgia, "Palatino Linotype", serif;
      }

      h1 {
        margin-bottom: 0.4rem;
      }

      .sample {
        margin-top: 1.5rem;
        padding: 1.2rem 1.4rem;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 16px 40px rgba(36, 29, 22, 0.08);
      }
    </style>
  </head>
  <body>
    <h1>Tibetan text demo</h1>
    <p>
      Load the unpacked extension first. If you open this file directly in Chrome, enable
      <strong>Allow access to file URLs</strong> for the extension so the content script can run on
      local files.
    </p>

    <div class="sample">
      <p>བོད་སྐད་ཡིག་ལ་མི་མང་པོས་དགའ་པོ་བྱེད།</p>
      <p>ཆོས་དང་ཞི་བདེ་ནི་གལ་ཆེན་པོ་རེད།</p>
      <p>དགེ་རྒན་ཞིག་གིས་བོད་སྐད་བསླབས།</p>
    </div>
  </body>
</html>
