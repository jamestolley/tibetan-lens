<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tibetan Lens</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="hero">
        <p class="eyebrow">Tibetan Lens</p>
        <h1>Tibetan Lens <span lang="bo">བོད་ཡིག་མིག་ཤེལ།</span></h1>
        <p class="intro" data-i18n="extensionDescription">
          Segment Tibetan text and click or hover tokens for definitions.
        </p>
      </header>

      <section class="card">
        <label class="toggle-row" for="insertSpaces">
          <span>Insert spaces between tokens</span>
          <input id="insertSpaces" type="checkbox" />
        </label>

        <label class="field" for="tooltipMode">
          <span>Show translations on</span>
          <select id="tooltipMode">
            <option value="hover">Hover</option>
            <option value="click">Click</option>
          </select>
        </label>

        <label class="toggle-row" for="showWylie">
          <span>Show Wylie</span>
          <input id="showWylie" type="checkbox" />
        </label>

        <label class="toggle-row" for="showPhonetic">
          <span>Show phonetic</span>
          <input id="showPhonetic" type="checkbox" />
        </label>

        <label class="field" for="minTibetanFontSize">
          <span>Minimum Tibetan font size</span>
          <input id="minTibetanFontSize" type="number" min="10" max="72" value="16" />
        </label>
      </section>

      <div class="actions">
        <button id="refreshPage" class="primary" type="button">Refresh page</button>
        <button id="openTestPage" class="secondary" type="button">Open test page</button>
        <button id="openOptions" class="secondary" type="button">Options</button>
      </div>
    </main>

    <script src="../shared/constants.js"></script>
    <script src="../shared/defaults.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="../core/mockDictionary.js"></script>
    <script src="./index.js"></script>
  </body>
</html>

</html>
