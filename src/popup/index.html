<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="popupTitle">Tibetan Lens</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="hero">
        <h1 data-i18n="extensionName">Tibetan Lens <span lang="bo">བོད་ཡིག་མིག་ཤེལ།</span></h1>
      </header>

      <section class="card">
        <label class="toggle-row" for="insertSpaces">
          <span data-i18n="insertSpaces">Insert spaces between tokens</span>
          <input id="insertSpaces" type="checkbox" />
        </label>

        <label class="toggle-row" for="colorByPos">
          <span data-i18n="colorByPos">Color words by part of speech</span>
          <input id="colorByPos" type="checkbox" />
        </label>

        <label class="field" for="tooltipMode">
          <span data-i18n="showTranslationsOn">Show translations on</span>
          <select id="tooltipMode">
            <option value="hover" data-i18n="tooltipModeHover">Hover</option>
            <option value="click" data-i18n="tooltipModeClick">Click</option>
          </select>
        </label>

        <label class="toggle-row" for="showWylie">
          <span data-i18n="showWylie">Show Wylie</span>
          <input id="showWylie" type="checkbox" />
        </label>

        <label class="toggle-row" for="showPhonetic">
          <span data-i18n="showPhonetic">Show phonetic</span>
          <input id="showPhonetic" type="checkbox" />
        </label>

        <label class="field" for="minTibetanFontSize">
          <span data-i18n="minTibetanFontSize">Minimum Tibetan font size</span>
          <input id="minTibetanFontSize" type="number" min="10" max="72" value="16" />
        </label>
      </section>

      <div class="actions">
        <button id="refreshPage" class="primary" type="button" data-i18n="refreshPage">Refresh page</button>
        <button id="insertTestText" class="secondary" type="button" data-i18n="insertTestText">Insert sample text</button>
        <button id="samplePage" class="secondary" type="button" data-i18n="samplePage">Sample page</button>
        <button id="openOptions" class="secondary" type="button" data-i18n="options">Options</button>
      </div>

      <p id="popupStatus" class="status-line" role="status" aria-live="polite"></p>
    </main>

    <script src="../shared/constants.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/defaults.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="../core/mockDictionary.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
